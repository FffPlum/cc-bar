name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Serialize publishing so two versions cannot race to replace the latest feed.
concurrency:
  group: ccbar-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate tagged source
    uses: ./.github/workflows/build.yml
    # No signing secrets are passed into the reusable validation workflow.

  package:
    name: Build and sign arm64 release
    needs: validate
    runs-on: macos-26-intel
    timeout-minutes: 40
    env:
      NODE_VERSION: '22.23.2'
      XCODE_VERSION: '26.6'
      TAG: ${{ github.ref_name }}
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate version, notes and main ancestry
        run: |
          python3 scripts/validate-release.py --tag "$TAG"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Validate signing configuration without exposing keys
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: python3 scripts/validate-release.py --tag "$TAG" --signing
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Release jobs do not restore caches produced by branch or PR code.
          package-manager-cache: false
      - name: Select pinned Xcode
        run: |
          touch "$RUNNER_TEMP/ccbar-diagnostics-start"
          sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          {
            sw_vers
            uname -m
            xcodebuild -version
            swift --version
          } | tee "$RUNNER_TEMP/toolchain.log"
      - name: Install locked dependencies
        run: |
          npm --prefix packages/host-api ci
          npm --prefix packages/interface ci
      - name: Package with the repository entry point
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          CCBAR_SIGN_IDENTITY: '-'
          CCBAR_BUILD_ARCH: arm64
        run: |
          set -o pipefail
          ./scripts/build.sh 2>&1 | tee "$RUNNER_TEMP/release-build.log"
      - name: Sign and verify the final update assets
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          python3 scripts/generate-update-feed.py \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --app build/Build/Products/Release/CCBar.app \
            --dist dist \
            --sign-update build/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update
      - name: Save complete release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Keep this name across attempts so "re-run failed jobs" can reuse a
          # successful package job; re-running every job replaces only this run.
          name: signed-release-${{ github.run_id }}
          overwrite: true
          path: |
            dist/CCBar.dmg
            dist/CCBar.app.zip
            dist/appcast.xml
            dist/release-notes.md
            dist/version.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Collect this job's CCBar and XCTest crash reports
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/ccbar-diagnostics-start" ]]; then
            mkdir -p "$RUNNER_TEMP/ccbar-crashes"
            for reports_dir in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
              if [[ -d "$reports_dir" ]]; then
                find "$reports_dir" -type f -newer "$RUNNER_TEMP/ccbar-diagnostics-start" \
                  \( -iname '*ccbar*.ips' -o -iname '*ccbar*.crash' -o -iname '*xctest*.ips' -o -iname '*xctest*.crash' \) \
                  -exec cp '{}' "$RUNNER_TEMP/ccbar-crashes/" \;
              fi
            done
          fi
      - name: Preserve packaging failure log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-build.log
            ${{ runner.temp }}/toolchain.log
            ${{ runner.temp }}/ccbar-crashes/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish complete draft
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      # Consume only this run's signed assets; no repository code runs with write access.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-${{ github.run_id }}
          path: dist
      - name: Create or resume a draft release
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/existing-release.json"; then
            if [[ "$(jq -r '.isDraft' "$RUNNER_TEMP/existing-release.json")" != true ]]; then
              echo 'This version is already published; published assets are never replaced.' >&2
              exit 1
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes-file dist/release-notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --draft --title "$TAG" --notes-file dist/release-notes.md
          fi
      - name: Upload all five assets to the draft
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/CCBar.dmg dist/CCBar.app.zip dist/appcast.xml \
            dist/release-notes.md dist/version.json
      - name: Verify uploaded assets before making the release visible
        run: |
          set -euo pipefail
          # The REST tag endpoint only finds published releases. gh resolves
          # drafts through GraphQL and exposes the numeric REST database ID.
          CCBAR_RELEASE_ID="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq '.databaseId')"
          [[ "$CCBAR_RELEASE_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid release ID' >&2; exit 1; }
          export CCBAR_RELEASE_ID
          gh api "repos/$GITHUB_REPOSITORY/releases/$CCBAR_RELEASE_ID" > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release.json').read_text())
          expected = {'CCBar.dmg', 'CCBar.app.zip', 'appcast.xml', 'release-notes.md', 'version.json'}
          assets = release['assets']
          assert release['id'] == int(os.environ['CCBAR_RELEASE_ID']), 'Release ID changed'
          assert release['draft'] and release['tag_name'] == os.environ['TAG'], 'Release is not the expected draft'
          assert len(assets) == len(expected) and {a['name'] for a in assets} == expected, 'Release asset set is incomplete'
          for asset in assets:
              size = (Path('dist') / asset['name']).stat().st_size
              assert size > 0 and asset['state'] == 'uploaded' and asset['size'] == size, 'Release asset upload is incomplete'
          PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$CCBAR_RELEASE_ID" \
            -f tag_name="$TAG" -F draft=false -f make_latest=true > "$RUNNER_TEMP/published-release.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'published-release.json').read_text())
          assert release['id'] == int(os.environ['CCBAR_RELEASE_ID']), 'Published release ID changed'
          assert release['tag_name'] == os.environ['TAG'] and release['draft'] is False, 'Release was not published'
          PY
